name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  RUST_NIGHTLY: nightly-2026-08-27
  CARGO_TERM_COLOR: never

jobs:
  host-tests:
    name: Host unit & property tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (pinned nightly)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_NIGHTLY }}
          targets: x86_64-unknown-none
          components: rust-src, llvm-tools, rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: kairos-core unit tests
        run: cargo test -p kairos-core

      - name: fuzz property tests (deterministic)
        run: cargo test -p fuzz --release -- --test-threads=1

      - name: clippy (host crates)
        run: cargo clippy -p kairos-core -p fuzz -- -D warnings

  coverage:
    name: Coverage (kairos-core, >70% gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (pinned nightly)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_NIGHTLY }}
          targets: x86_64-unknown-none
          components: rust-src, llvm-tools

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Measure line coverage of the host-testable core
        run: |
          cargo llvm-cov -p kairos-core -p fuzz \
            --lcov --output-path coverage.lcov
          cargo llvm-cov report --summary-only

      - name: Gate coverage at 70%
        run: |
          THRESHOLD=70
          # Line coverage from the lcov artifact (LF = lines found,
          # LH = lines hit). Independent of the report table layout, which
          # varies across cargo-llvm-cov releases.
          COV=$(awk -F: '/^LF:/{lf+=$2} /^LH:/{lh+=$2} \
            END {printf "%.1f", (lf>0 ? 100*lh/lf : 0)}' coverage.lcov)
          echo "core line coverage: ${COV}%"
          awk "BEGIN{exit !($COV >= $THRESHOLD)}" \
            || { echo "coverage ${COV}% below gate ${THRESHOLD}%"; exit 1; }

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage.lcov

  qemu-integration:
    name: QEMU integration (boot + self-tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (pinned nightly)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_NIGHTLY }}
          targets: x86_64-unknown-none
          components: rust-src, llvm-tools

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86

      - name: Build boot image
        run: cargo build -p os

      - name: Boot under QEMU with in-guest self-tests
        run: KAIROS_TEST=1 KAIROS_QEMU=qemu-system-x86_64 cargo run -p os

      - name: Boot without self-tests (shell milestone, 15 s watchdog)
        run: |
          timeout 15 bash -c 'KAIROS_QEMU=qemu-system-x86_64 cargo run -p os - < /dev/null \
            | tee /tmp/kairos-boot.log' || true
          grep -Eq "kairos shell .*type \`help\`" /tmp/kairos-boot.log || \
            { echo "shell banner not seen"; exit 1; }