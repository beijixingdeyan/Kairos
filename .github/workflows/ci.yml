name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  RUST_NIGHTLY: nightly-2026-08-27
  CARGO_TERM_COLOR: never

jobs:
  host-tests:
    name: Host unit & property tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (pinned nightly)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_NIGHTLY }}
          targets: x86_64-unknown-none
          components: rust-src, llvm-tools, rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: kairos-core unit tests
        run: cargo test -p kairos-core

      - name: fuzz property tests (deterministic)
        run: cargo test -p fuzz --release -- --test-threads=1

      - name: clippy (host crates)
        run: cargo clippy -p kairos-core -p fuzz -- -D warnings

  coverage:
    name: Coverage (kairos-core, >70% gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (pinned nightly)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_NIGHTLY }}
          targets: x86_64-unknown-none
          components: rust-src, llvm-tools

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Measure line coverage of the host-testable core
        run: |
          cargo llvm-cov -p kairos-core -p fuzz \
            --lcov --output-path coverage.lcov
          cargo llvm-cov report --summary-only

      - name: Gate coverage at 70%
        run: |
          THRESHOLD=70
          # Line coverage from the lcov artifact (LF = lines found,
          # LH = lines hit). Independent of the report table layout, which
          # varies across cargo-llvm-cov releases.
          COV=$(awk -F: '/^LF:/{lf+=$2} /^LH:/{lh+=$2} \
            END {printf "%.1f", (lf>0 ? 100*lh/lf : 0)}' coverage.lcov)
          echo "core line coverage: ${COV}%"
          awk "BEGIN{exit !($COV >= $THRESHOLD)}" \
            || { echo "coverage ${COV}% below gate ${THRESHOLD}%"; exit 1; }

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage.lcov

  qemu-integration:
    name: QEMU integration (boot + self-tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (pinned nightly)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_NIGHTLY }}
          targets: x86_64-unknown-none
          components: rust-src, llvm-tools

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache the QEMU 9.2 build
        uses: actions/cache@v4
        with:
          path: /opt/kairos-qemu
          key: kairos-qemu-9.2.0

      - name: Open /dev/kvm for the KVM leg of the experiment
        if: always()
        run: sudo chmod 666 /dev/kvm || true

      - name: Build QEMU 9.2 from source (cached)
        # apt's qemu 8.2 + SeaBIOS never finishes POST on this image (the
        # guest hangs in SMM with an endless vector-0x08 timer flood under
        # TCG, KVM, icount and nodefaults alike). Build 9.2.0 - the same
        # generation as the QEMU the local development and verification
        # used - once, and cache the install under /opt/kairos-qemu.
        run: |
          if [ ! -x /opt/kairos-qemu/bin/qemu-system-x86_64 ]; then
            sudo apt-get install -y build-essential ninja-build pkg-config \
              libglib2.0-dev libpixman-1-dev zlib1g-dev libfdt-dev
            wget -q https://download.qemu.org/qemu-9.2.0.tar.xz -O /tmp/qemu.tar.xz
            tar -xf /tmp/qemu.tar.xz -C /tmp
            cd /tmp/qemu-9.2.0
            CFLAGS="-fPIE" ./configure --target-list=x86_64-softmmu --prefix=/opt/kairos-qemu \
              --disable-docs --disable-pie
            make -j"$(nproc)"
            sudo make install
          fi
          /opt/kairos-qemu/bin/qemu-system-x86_64 --version | head -n 1

      - name: Build boot image
        run: cargo build -p os

      - name: Boot under QEMU with in-guest self-tests
        # `timeout` turns a hang into a visible failure and prints the last
        # guest output (a wedged boot shows exactly where it stopped).
        run: |
          set +e
          KAIROS_TEST=1 KAIROS_QEMU=/opt/kairos-qemu/bin/qemu-system-x86_64 \
            timeout 300 cargo run -p os -- -icount shift=0 -d int -D /tmp/kairos-int-test.log
          code=$?
          echo "runner exit: $code"
          echo "--- int log structure ---"
          if [ -f /tmp/kairos-int-test.log ]; then
            echo "bytes: $(stat -c %s /tmp/kairos-int-test.log) lines: $(wc -l < /tmp/kairos-int-test.log)"
            echo "--- head 6 ---"; head -6 /tmp/kairos-int-test.log | cut -c1-90
            echo "--- tail 6 ---"; tail -6 /tmp/kairos-int-test.log | cut -c1-90
            echo "flood lines: $(grep -c 'INT=0x08' /tmp/kairos-int-test.log)"
          else
            echo "(no int log)"
          fi
          [ $code -eq 124 ] && { echo "TIMED OUT: the in-guest self-tests \
          did not finish; last guest output above"; exit 1; }
          exit $code

      - name: Boot without self-tests (shell milestone, KVM, 90 s watchdog)
        if: always()
        run: |
          set +e
          timeout 90 bash -c 'KAIROS_QEMU=/opt/kairos-qemu/bin/qemu-system-x86_64 \
            cargo run -p os -- -accel kvm -cpu max -d int -D /tmp/kairos-int.log < /dev/null \
            | tee /tmp/kairos-boot.log' || true
          echo "--- guest output (tail) ---"
          tail -c 3000 /tmp/kairos-boot.log
          echo "--- int log structure ---"
          if [ -f /tmp/kairos-int.log ]; then
            echo "bytes: $(stat -c %s /tmp/kairos-int.log) lines: $(wc -l < /tmp/kairos-int.log)"
            echo "--- tail 4 ---"; tail -4 /tmp/kairos-int.log | cut -c1-90
            echo "flood lines: $(grep -c 'INT=0x08' /tmp/kairos-int.log)"
          else
            echo "(no int log)"
          fi
          grep -Eq "kairos shell .*type \`help\`" /tmp/kairos-boot.log || \
            { echo "shell banner not seen"; exit 1; }